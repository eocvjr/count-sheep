<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151e29">
<meta name="description" content="Tap anywhere to count a sheep in a quiet nighttime meadow."><title>count sheep</title>
<style>
:root{color-scheme:dark;--cream:#d8d8ca;--muted:#8e9c9d;--line:#ffffff14}*{box-sizing:border-box}body{margin:0;background:#151e29;color:var(--cream);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-weight:300;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #c6c9b7;outline-offset:6px}#world{position:relative;height:100svh;min-height:380px;overflow:hidden;background:radial-gradient(ellipse at 68% 31%,#28364055,transparent 45%),linear-gradient(#151e29,#1c2932)}#tap{position:absolute;inset:0;width:100%;height:100%;border:0;background:none;z-index:3;cursor:pointer}header{position:absolute;top:max(30px,env(safe-area-inset-top));left:5%;right:5%;display:flex;align-items:center;justify-content:space-between;z-index:4;pointer-events:none}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:11px}.brand svg{width:28px;height:28px;opacity:.75}.night{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--muted)}.intro{position:absolute;top:22%;width:100%;text-align:center;pointer-events:none;z-index:2;transition:opacity 2s}.eyebrow{text-transform:uppercase;letter-spacing:4px;font-size:10px;color:var(--muted)}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(40px,6vw,74px);font-weight:400;letter-spacing:-2px;margin:20px 0 18px}h1 em{font-weight:400;color:#a4b6ac}.intro p{font-size:13px;color:#9ba9a8;line-height:1.9;margin:0}.moon{position:absolute;right:17%;top:15%;width:44px;height:44px;border-radius:50%;background:#c7ccb655;box-shadow:0 0 60px 15px #c7ccb607}.moon:after{content:'';position:absolute;inset:-5px 9px 8px -4px;border-radius:50%;background:#1a2530}.star{position:absolute;border-radius:50%;background:#b6c5c1;opacity:.32}.land{position:absolute;inset:48% 0 0;pointer-events:none}.land svg{width:100%;height:100%;overflow:visible}.footer{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:5%;right:5%;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:15px}.dedication{font:italic 14px Georgia,serif;color:#94a29b}.settings{display:flex;align-items:center;gap:9px}.small-button{border:1px solid #9db2a022;background:#16262b80;border-radius:30px;padding:10px 16px;font-size:11px;letter-spacing:.3px;min-height:40px}.small-button:hover{background:#263a3c}.small-button[aria-pressed=true]{border-color:#a4b6ac77}.hint{position:absolute;bottom:19%;width:100%;text-align:center;z-index:2;pointer-events:none;font-size:10px;text-transform:uppercase;letter-spacing:3px;color:#a1b3a5;transition:opacity 2s}.hint span{display:block;margin-top:10px;font-size:11px;letter-spacing:1px;text-transform:none;color:#82958d}#count{position:absolute;top:calc(max(30px,env(safe-area-inset-top)) + 50px);right:5%;z-index:2;font:italic 14px Georgia,serif;color:#a5b5a9}#sheep-layer{position:absolute;inset:0;z-index:2;pointer-events:none}.sheep{position:absolute;width:clamp(90px,10vw,145px);height:auto;will-change:transform;filter:drop-shadow(0 12px 10px #0b14152b)}.quiet .intro{opacity:.35}.quiet .hint{opacity:.4}.dimmer{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5;transition:opacity 2s}.dim .dimmer{opacity:.42}@media(max-width:600px){header{top:26px}.brand{font-size:20px}.night{letter-spacing:2px;font-size:8px}.intro{top:25%}h1{letter-spacing:-1px}.intro p{font-size:12px}.moon{top:14%;right:20%;width:35px;height:35px}.footer{bottom:25px;align-items:flex-end}.dedication{max-width:100px;line-height:1.5;font-size:12px}.small-button{padding:9px 12px;font-size:10px}.hint{bottom:21%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.footer{justify-content:flex-end}.small-button{width:42px;height:42px;padding:10px;display:grid;place-items:center}.small-button svg{width:20px;height:20px}
#count{top:max(30px,env(safe-area-inset-top));font:20px Georgia,serif;line-height:28px}
[hidden]{display:none!important}
#options{position:absolute;right:5%;bottom:84px;z-index:6;width:min(280px,90vw);padding:22px;border:1px solid #a5b5a925;border-radius:20px;background:#1b2b30;box-shadow:0 12px 45px #0003;font-size:13px}
#options h2{font:18px Georgia,serif;margin:0 0 20px}
.option-row,.limit-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 0;color:#bdc8bf}
input[type=checkbox]{accent-color:#a5b5a9;width:19px;height:19px;cursor:pointer}
input[type=number]{width:85px;padding:9px;color:var(--cream);background:#142327;border:1px solid #a5b5a940;border-radius:8px;font:inherit}
input:disabled{opacity:.35}
input:focus-visible,.save-options:focus-visible{outline:2px solid #c6c9b7;outline-offset:3px}
.save-options{width:100%;padding:11px;border:1px solid #a5b5a940;border-radius:12px;background:#263c3d;font-size:12px}
#blackout{position:fixed;inset:0;z-index:100;width:100%;height:100%;border:0;padding:0;background:#000;opacity:0;cursor:default;transition:opacity 2.5s;outline:none}
#blackout.active{opacity:1}
@media(prefers-reduced-motion:reduce){#blackout{transition:none}}
</style>
</head>
<body>
<main id="world">
<button id="tap" aria-label="Let a sheep hop across the meadow"></button>
<header><div class="brand"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M29 7a15 15 0 1 0 5 23A14 14 0 0 1 29 7Z" stroke="currentColor" stroke-width="1.4"/><path d="M33 6v6M30 9h6" stroke="currentColor"/></svg>count sheep</div></header>
<div class="moon" aria-hidden="true"></div><div id="stars" aria-hidden="true"></div>
<div class="land" aria-hidden="true"><svg viewBox="0 0 1440 600" preserveAspectRatio="none"><path d="M0 230Q230 55 570 200T1440 130V600H0Z" fill="#253b3e"/><path d="M0 290Q350 150 780 270T1440 200V600H0Z" fill="#223b37"/><path d="M0 385Q330 225 760 350T1440 315V600H0Z" fill="#1c332e"/><path d="M0 455Q370 345 760 442T1440 400V600H0Z" fill="#192e29"/><g stroke="#597560" stroke-width="2" fill="none" opacity=".28"><path d="M80 500q8-30 3-43m0 43q-13-25-20-26M1250 470q-2-30 7-43m-7 43q13-22 20-25M260 550q-5-27 3-39M1100 555q10-24 8-35"/></g></svg></div>
<div id="sheep-layer" aria-hidden="true"></div>
<div id="count" aria-label="Sheep counted" hidden></div>
<footer class="footer"><div class="settings"><button id="options-toggle" class="small-button" aria-label="Options" title="Options" aria-expanded="false" aria-controls="options"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="#192b30"/><circle cx="15" cy="17" r="3" fill="#192b30"/></svg></button><button id="dim" class="small-button" aria-label="Dim the lights" title="Dim the lights" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M19 15A8 8 0 0 1 9 5a8 8 0 1 0 10 10Z"/></svg></button></div></footer>
<section id="options" role="dialog" aria-modal="false" aria-labelledby="options-title" hidden>
<form id="options-form">
<h2 id="options-title">Options</h2>
<label class="option-row"><span>Show counter</span><input id="show-count" type="checkbox"></label>
<label class="option-row"><span>Go dark at a limit</span><input id="use-limit" type="checkbox"></label>
<label class="limit-row" for="max-count"><span>Max sheep</span><input id="max-count" type="number" inputmode="numeric" min="1" max="99999" step="1" value="30" required disabled></label>
<button class="save-options" type="submit">Done</button>
</form>
</section>
<div class="dimmer"></div>
<button id="blackout" aria-label="Sheep limit reached. Tap to start again." hidden></button>
</main>
<script>
const world=document.querySelector('#world'),layer=document.querySelector('#sheep-layer'),countLabel=document.querySelector('#count');
let count=0,showCount=false,queue=0,lastLaunch=0,frame=0,maxCount=null,asleep=false,wakeReady=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const sheepSVG=`<svg viewBox="0 0 180 130" xmlns="http://www.w3.org/2000/svg"><g stroke="#343f3d" stroke-width="7" stroke-linecap="round"><path d="M60 87 47 108 33 110M93 89l-2 22 15 5M112 83l16 19 17-4"/></g><g fill="#c9ccba"><circle cx="44" cy="65" r="16"/><circle cx="57" cy="47" r="20"/><circle cx="80" cy="43" r="22"/><circle cx="104" cy="48" r="20"/><circle cx="119" cy="67" r="21"/><circle cx="103" cy="84" r="21"/><circle cx="77" cy="88" r="21"/><circle cx="53" cy="82" r="19"/><ellipse cx="81" cy="66" rx="35" ry="28"/></g><path d="M120 46q12-22 24-12-1 17-17 23" fill="#444f47"/><ellipse cx="139" cy="65" rx="19" ry="25" transform="rotate(-24 139 65)" fill="#3e4943"/><path d="M141 64q5 5 10 1" fill="none" stroke="#b6bdac" stroke-width="2" stroke-linecap="round"/><path d="M56 52q5-7 12-5M80 67q5-7 12-4M59 80q4-5 9-3" fill="none" stroke="#b5bca9" stroke-width="2" stroke-linecap="round"/></svg>`;
function updateCount(){countLabel.textContent=String(count);countLabel.hidden=!showCount;}
function launch(now){
 const sheep=document.createElement('div');sheep.className='sheep';sheep.innerHTML=sheepSVG;layer.appendChild(sheep);
 const w=world.clientWidth,h=world.clientHeight,size=sheep.getBoundingClientRect().width;
 const right=Math.random()>.5,baseline=h*(.70+Math.random()*.06);
 const height=reduced.matches?h*.04:h*(.30+Math.random()*.07);
 const duration=reduced.matches?1400:4800+Math.random()*600;
 const start=now;
 function move(t){
  if(asleep||document.hidden){sheep.remove();return;}
  const p=Math.min(1,(t-start)/duration),travel=w+size*2;
  const x=right?w+size-p*travel:-size+p*travel;
  // A full, tall parabola: rise, slow at the apex, then fall.
  const y=baseline-4*height*p*(1-p);
  const slope=-4*height*(1-2*p)/travel;
  const angle=reduced.matches?0:Math.max(-22,Math.min(22,Math.atan(slope)*180/Math.PI));
  sheep.style.transform=`translate(${x}px,${y}px) scaleX(${right?-1:1}) rotate(${angle}deg)`;
  sheep.style.opacity=reduced.matches?Math.sin(Math.PI*p):1;
  if(p<1&&!document.hidden)requestAnimationFrame(move);else sheep.remove();
 }
 requestAnimationFrame(move);
}
const options=document.querySelector('#options'),optionsToggle=document.querySelector('#options-toggle');
const showInput=document.querySelector('#show-count'),limitInput=document.querySelector('#use-limit'),maxInput=document.querySelector('#max-count'),blackout=document.querySelector('#blackout');
function closeOptions(){options.hidden=true;optionsToggle.setAttribute('aria-expanded','false');}
function sleep(){
 if(asleep)return;
 asleep=true;wakeReady=false;queue=0;cancelAnimationFrame(frame);frame=0;layer.replaceChildren();closeOptions();
 world.inert=true;blackout.hidden=false;
 // Keep the wake button outside the inert meadow.
 document.body.appendChild(blackout);blackout.focus();
 document.querySelector('meta[name="theme-color"]').content='#000000';
 blackout.getBoundingClientRect();
 requestAnimationFrame(()=>blackout.classList.add('active'));
 setTimeout(()=>{wakeReady=true;},reduced.matches?0:2500);
}
blackout.addEventListener('click',()=>{
 if(!wakeReady)return;
 asleep=false;wakeReady=false;count=0;updateCount();
 blackout.classList.remove('active');blackout.hidden=true;world.inert=false;
 document.querySelector('meta[name="theme-color"]').content='#151e29';
 document.querySelector('#tap').focus({preventScroll:true});
});
function tick(now){
 frame=0;if(document.hidden||asleep){queue=0;return;}
 if(queue&&now-lastLaunch>=1100){queue--;lastLaunch=now;launch(now);}
 if(queue)frame=requestAnimationFrame(tick);
}
function tap(){
 if(asleep)return;
 if(!options.hidden){closeOptions();optionsToggle.focus();return;}
 count++;updateCount();
 if(maxCount!==null&&count>=maxCount){sleep();return;}
 queue++;if(!frame)frame=requestAnimationFrame(tick);
}
document.querySelector('#tap').addEventListener('click',tap);
optionsToggle.addEventListener('click',()=>{
 if(!options.hidden){closeOptions();return;}
 showInput.checked=showCount;limitInput.checked=maxCount!==null;
 maxInput.disabled=!limitInput.checked;maxInput.value=maxCount??30;
 options.hidden=false;optionsToggle.setAttribute('aria-expanded','true');showInput.focus();
});
limitInput.addEventListener('change',()=>{maxInput.disabled=!limitInput.checked;});
document.querySelector('#options-form').addEventListener('submit',e=>{
 e.preventDefault();
 if(!maxInput.disabled&&!maxInput.checkValidity()){maxInput.reportValidity();return;}
 showCount=showInput.checked;maxCount=limitInput.checked?Number(maxInput.value):null;
 updateCount();closeOptions();optionsToggle.focus();
 if(maxCount!==null&&count>=maxCount)sleep();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!options.hidden){closeOptions();optionsToggle.focus();}});
document.querySelector('#dim').addEventListener('click',e=>{const dim=world.classList.toggle('dim');e.currentTarget.setAttribute('aria-pressed',dim);e.currentTarget.setAttribute('aria-label',dim?'Restore lights':'Dim the lights');e.currentTarget.title=dim?'Restore lights':'Dim the lights';});
document.addEventListener('visibilitychange',()=>{if(document.hidden){queue=0;cancelAnimationFrame(frame);frame=0;layer.replaceChildren();}});
for(let i=0;i<30;i++){const s=document.createElement('i');s.className='star';s.style.cssText=`left:${3+Math.random()*94}%;top:${8+Math.random()*43}%;width:${i%5===0?2:1}px;height:${i%5===0?2:1}px;opacity:${.12+Math.random()*.24}`;document.querySelector('#stars').appendChild(s);}
</script>
</body>
</html>
